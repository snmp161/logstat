# GoReleaser builds the release: static binaries, .deb/.rpm through its built-in
# nfpm and the GitHub Release itself. `make package` uses nfpm.yaml directly for
# local packaging — keep the two package layouts in sync.
version: 2

project_name: logstat

before:
  hooks:
    - go mod download

builds:
  - id: logstat
    main: ./cmd/logstat
    binary: logstat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: logstat
    ids:
      - logstat
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.ru.md
      - LICENSE
      - NOTICE
      - packaging/default.yaml
      - packaging/logstat@.service

nfpms:
  - id: packages
    ids:
      - logstat
    package_name: logstat
    vendor: Sergey Ovchinnikov
    homepage: https://github.com/snmp161/logstat
    maintainer: Sergey Ovchinnikov <sovchinnikov@gmail.com>
    license: Apache-2.0
    description: |
      Count code words in a log file and keep the counters in Redis.
      logstat follows a line-oriented log file in the manner of "tail -F", counts
      the configured code words per line and maintains incremental counters in
      Redis, which are optionally zeroed on a cron schedule.
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    release: "1"
    # The distro-conventional names, which is also what `make package` produces
    # locally and what the install snippet on the release page tells people to
    # run: goreleaser's default (logstat_0.4.0_linux_amd64.deb) would leave that
    # snippet pointing at a file that does not exist.
    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}-{{ .Release }}_{{ if eq .Arch "amd64" }}amd64{{ else }}{{ .Arch }}{{ end }}
    contents:
      - src: packaging/default.yaml
        dst: /etc/logstat/default.yaml
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packaging/logstat@.service
        dst: /lib/systemd/system/logstat@.service
        file_info:
          mode: 0644
    overrides:
      rpm:
        file_name_template: >-
          {{ .PackageName }}-{{ .Version }}-{{ .Release }}.{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "arm64" }}aarch64{{ else }}{{ .Arch }}{{ end }}
        contents:
          - src: packaging/default.yaml
            dst: /etc/logstat/default.yaml
            type: config|noreplace
            file_info:
              mode: 0644
          # On rpm distributions /lib is a symlink to /usr/lib, so the unit goes
          # to its real path.
          - src: packaging/logstat@.service
            dst: /usr/lib/systemd/system/logstat@.service
            file_info:
              mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  # Shown above the generated changelog. Kept permanent and worded per source
  # version, so that whichever release page someone lands on tells them what an
  # upgrade does to their Redis keys.
  header: |
    ## Upgrading

    The integer counters `logstat:counter:<host>:<action>` are never rewritten by
    an upgrade: whatever was accumulated keeps counting from its current value.

    **Coming from v0.3.0?** Nothing to do. v0.4.0 adds case-insensitive matching
    (`case_sensitive`) and a Prometheus exporter with a status page (`metrics`),
    and every new option defaults to the behaviour you already have: matching
    stays case-sensitive and no port is opened. Both are opt-in, one line each:

    ```yaml
    case_sensitive: no       # match GET-NUMBER and Get-Number as well
    metrics:
      enabled: true          # exporter on 127.0.0.1:9843, status page on /
    ```

    With several instances on one host, give each its own `metrics.listen`: a
    port already in use is a fatal startup error, exactly like a shared
    `lock_file`.

    **Coming from v0.2.0 or earlier?** Since v0.3.0 the keys carry an expiry:
    `redis.ttl` defaults to `86400` (one day). It is refreshed on every flush, so
    the keys of a running instance never expire — they only disappear about a day
    after the instance stops reporting. Set `redis.ttl: 0` under `redis:` to keep
    the previous behaviour of keys that live forever.

    **Coming from v0.1.0?** The preformatted monitoring value was renamed in
    v0.2.0 from `logstat:<host>_type=<action>` to
    `logstat:heartbeat:<host>:<action>`, and it can now be switched off entirely
    with `heartbeat_key: false`. Update the key pattern in your monitoring reader
    and drop the stale keys, which logstat leaves alone:

    ```sh
    redis-cli --scan --pattern 'logstat:*_type=*' | xargs -r redis-cli del
    ```

  footer: |
    ## Install

    ```sh
    # Debian/Ubuntu
    sudo dpkg -i logstat_{{ trimprefix .Tag "v" }}-1_amd64.deb
    # RHEL/Alma/Rocky
    sudo rpm -i logstat-{{ trimprefix .Tag "v" }}-1.x86_64.rpm
    ```

    Then edit `/etc/logstat/<instance>.yaml` and run
    `systemctl enable --now logstat@<instance>`.
