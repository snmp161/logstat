# logstat — example configuration for the instance "default".
#
# The template unit logstat@<name>.service reads /etc/logstat/<name>.yaml, so
# this file belongs to `systemctl start logstat@default`. Copy it to
# /etc/logstat/<name>.yaml for every additional instance and give each one its
# own lock_file (and its own logging.file, if file logging is used).
#
# Every field below is optional: the built-in default is shown as the value.

# Path to the watched log file. Any software writing line by line will do.
log_path: /var/log/app.log

# Code words to count. Matching is a substring search anywhere in the line,
# counted once per line.
# WARNING: avoid words that are a substring of another word in this list —
# "getStatus" would also be counted inside "getStatusExtended". logstat logs a
# warning at startup when it finds such a pair.
actions:
  - get-number
  - get-sms
  - getNumber
  - getStatus

# Take the case into account when matching. yes (the default) compares byte for
# byte, so only "get-number" matches "get-number"; no lowercases both the line
# and the code words first, so "GET-NUMBER" and "Get-Number" match as well.
# Only matching is affected: the Redis keys always spell the word the way this
# list does, never the way the log line does.
case_sensitive: yes

# How often the in-memory buffer is flushed to Redis, in seconds.
flush_interval: 10

# Poll the file instead of using inotify. Needed on network file systems.
poll: false

# Maintain the preformatted heartbeat key for the monitoring reader
# (logstat:heartbeat:<host>:<action>). Set to false to keep only the integer
# counters logstat:counter:<host>:<action>.
heartbeat_key: true

# Lock file of this instance, protecting against a manual double start.
# IMPORTANT: with several configs on one host every one of them needs its OWN
# path. The template unit provides /run/logstat/<instance> via RuntimeDirectory,
# which is the only writable location under ProtectSystem=strict.
lock_file: /run/logstat/default/logstat.lock

redis:
  host: 127.0.0.1        # Redis may live on another machine
  port: 6379
  db: 0
  password: ""           # for requirepass; empty means no AUTH
  # Expiry of the keys logstat writes, in seconds (86400 = one day, 0 = never).
  # It is refreshed on every flush, so it measures how long the keys outlive this
  # instance: they survive as long as the daemon runs and disappear once it is
  # gone for good. Must be longer than flush_interval.
  ttl: 86400

# The daemon's own log.
logging:
  level: info            # debug | info | warn | error
  output: journald       # journald (= stderr, collected by systemd) | file
  file: ""               # only used with output: file; must be unique per config
                         # and needs LogsDirectory=logstat in the unit, because
                         # ProtectSystem=strict makes /var/log read-only

# Self-reset of the counters on a cron schedule.
reset:
  enabled: true          # false: only count, something external does the zeroing
  schedule: "0 0 * * *"  # standard 5-field cron; default is daily at midnight

# Prometheus exporter: uptime, the configuration of this instance, the per-word
# counters of this process and the per-word totals read from Redis on scrape.
metrics:
  enabled: false         # off by default: no port is opened unless asked for
  listen: 127.0.0.1:9843 # host:port; loopback only unless you publish it
                         # IMPORTANT: with several configs on one host the port
                         # must be DIFFERENT for each — a taken port is a fatal
                         # startup error, exactly like a taken lock_file
  path: /metrics         # the exposition endpoint; the root of the same port
                         # shows a human-readable status page, and every other
                         # path answers 404
